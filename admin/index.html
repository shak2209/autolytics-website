<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff sign in | Autolytics</title>
  <meta name="description" content="Staff sign in for the Autolytics demo admin area.">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">Autolytics <span>IT Consultancy</span></a>
    </div>
  </header>

  <main>
    <section class="admin-section">
      <div class="container">
        <div class="auth-card">
          <h1>Staff sign in</h1>
          <p class="muted">Authorised staff only.</p>

          <p id="login-notice" class="notice" role="status" hidden></p>

          <form id="login-form" novalidate>
            <div class="form-field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <div class="password-row">
                <input id="password" name="password" type="password" autocomplete="current-password">
                <button type="button" id="toggle-password" class="btn btn-secondary btn-small">Show password</button>
              </div>
            </div>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn">Sign in</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/store.js"></script>
  <script src="users.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
